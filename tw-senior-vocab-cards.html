<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣高中英文參考詞彙表 單字卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; background: #f0f4ff; min-height: 100vh; color: #333; }
  header { background: linear-gradient(135deg,#4a6cf7,#7b5cf0); color: #fff; padding: 18px 12px; text-align: center; }
  header h1 { font-size: 1.4rem; }
  header p { font-size: .85rem; opacity: .85; margin-top: 4px; }
  .tabs { display: flex; justify-content: center; gap: 10px; margin: 16px auto 8px; flex-wrap: wrap; }
  .tabs button { padding: 10px 24px; border: none; border-radius: 24px; font-size: 1rem; cursor: pointer; background: #dfe6ff; color: #4a6cf7; font-weight: bold; transition: .2s; }
  .tabs button.active { background: #4a6cf7; color: #fff; }
  .panel { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  /* 左右箭頭 */
  .arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 56px; height: 56px; border: none; border-radius: 50%; font-size: 1.6rem; cursor: pointer;
    background: #4a6cf7; color: #fff; box-shadow: 0 4px 14px rgba(74,108,247,.4); transition: .2s; display: none; }
  .arrow:hover { background: #7b5cf0; transform: translateY(-50%) scale(1.1); }
  .arrow.left { left: 12px; }
  .arrow.right { right: 12px; }
  /* 單字卡 */
  .card-wrap { perspective: 1000px; margin: 18px auto; width: 100%; max-width: 420px; height: 260px; cursor: pointer; }
  .card { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 24px rgba(74,108,247,.18); padding: 16px; }
  .front { background: #fff; }
  .back { background: #4a6cf7; color: #fff; transform: rotateY(180deg); }
  .emoji { font-size: 3.4rem; line-height: 1; }
  .word { font-size: 2rem; font-weight: bold; color: #333; text-align: center; }
  .pos { font-size: .9rem; color: #999; }
  .zh { font-size: 1.6rem; font-weight: bold; text-align: center; }
  .hint { font-size: .8rem; color: #bbb; }
  .speak-row { display: flex; gap: 12px; }
  .speak-btn { border: none; background: #eef2ff; border-radius: 50%; width: 52px; height: 52px; font-size: 1.15rem; cursor: pointer; transition: .2s; }
  .speak-btn:hover { background: #dfe6ff; transform: scale(1.08); }
  .speak-btn.light { background: rgba(255,255,255,.25); }
  .speak-btn.sm { width: 38px; height: 38px; font-size: .95rem; }
  .nav { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 8px; }
  .nav button { padding: 10px 22px; border: none; border-radius: 12px; background: #4a6cf7; color: #fff; font-size: 1rem; cursor: pointer; }
  .nav button.ghost { background: #dfe6ff; color: #4a6cf7; }
  .counter { font-weight: bold; color: #666; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .filter-row button { border: 1px solid #ccd6ff; background: #fff; color: #4a6cf7; border-radius: 8px; padding: 4px 9px; font-size: .82rem; cursor: pointer; }
  .filter-row button.active { background: #4a6cf7; color: #fff; }
  /* 單字列表 */
  .list-tools { display: flex; gap: 10px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }
  .list-tools input { padding: 9px 16px; border: 1px solid #ccd6ff; border-radius: 20px; font-size: 1rem; width: min(320px,80vw); outline: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 12px; }
  .item { background: #fff; border-radius: 14px; padding: 12px 10px; text-align: center; box-shadow: 0 3px 10px rgba(74,108,247,.10); }
  .item .em { font-size: 1.9rem; }
  .item .wd { font-weight: bold; margin-top: 4px; word-break: break-word; }
  .item .ps { font-size: .75rem; color: #999; }
  .item .zw { font-size: .9rem; color: #555; margin-top: 2px; }
  .item button { margin-top: 6px; }
  /* 測驗 */
  .quiz-box { background: #fff; border-radius: 20px; padding: 28px 20px; box-shadow: 0 8px 24px rgba(74,108,247,.15); text-align: center; margin-top: 18px; max-width: 640px; margin-left: auto; margin-right: auto; }
  .quiz-zh { font-size: 1.5rem; font-weight: bold; margin-bottom: 4px; }
  .quiz-pos { color: #999; font-size: .9rem; margin-bottom: 18px; }
  .blanks { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 18px; }
  .ch { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 44px; font-size: 1.4rem; font-weight: bold; }
  .ch.shown { color: #4a6cf7; border-bottom: 3px solid #ccd6ff; }
  .ch input { width: 34px; height: 44px; text-align: center; font-size: 1.4rem; font-weight: bold; border: none; border-bottom: 3px solid #4a6cf7; background: #f6f8ff; outline: none; text-transform: lowercase; }
  .ch input.ok { color: #1a9c4b; border-bottom-color: #1a9c4b; background: #e9f9ef; }
  .ch input.bad { color: #d33; border-bottom-color: #d33; background: #fdecec; }
  .ch.space { width: 16px; }
  .ch.punct { color: #aaa; }
  .setup-label { font-weight: bold; margin: 14px 0 8px; color: #555; }
  .setup-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .setup-row button { padding: 8px 18px; border: 1px solid #ccd6ff; background: #fff; color: #4a6cf7; border-radius: 18px; font-size: .95rem; cursor: pointer; }
  .setup-row button.active { background: #4a6cf7; color: #fff; }
  .quiz-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .quiz-actions button { padding: 10px 20px; border: none; border-radius: 12px; font-size: 1rem; cursor: pointer; background: #4a6cf7; color: #fff; }
  .quiz-actions button.ghost { background: #dfe6ff; color: #4a6cf7; }
  .quiz-actions button.warn { background: #f7a54a; }
  .feedback { margin-top: 14px; font-size: 1.15rem; font-weight: bold; min-height: 1.6em; }
  .feedback.good { color: #1a9c4b; }
  .feedback.bad { color: #d33; }
  .score { margin-top: 6px; color: #666; }

  /* 下載提示列（Android Chrome 相容） */
  #dlBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 99; display: none;
    align-items: center; justify-content: center; gap: 10px; padding: 14px 16px;
    background: #333; box-shadow: 0 -4px 16px rgba(0,0,0,.25); flex-wrap: wrap; }
  #dlBar a { color: #ffd54a; font-weight: bold; font-size: .95rem; word-break: break-all; }
  #dlBar .tip { color: #bbb; font-size: .8rem; width: 100%; text-align: center; }
  #dlBar button { border: none; background: #666; color: #fff; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; flex-shrink: 0; }
  /* 學習歷程 */
  .hist-summary { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
  .stat-card { background: #fff; border-radius: 14px; padding: 14px 20px; text-align: center; box-shadow: 0 3px 10px rgba(74,108,247,.10); min-width: 110px; }
  .stat-card .num { font-size: 1.6rem; font-weight: bold; color: #4a6cf7; }
  .stat-card .lbl { font-size: .8rem; color: #888; margin-top: 2px; }
  .hist-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .hist-actions button { padding: 9px 18px; border: none; border-radius: 12px; font-size: .95rem; cursor: pointer; background: #4a6cf7; color: #fff; }
  .hist-actions button.ghost { background: #dfe6ff; color: #4a6cf7; }
  .hist-actions button.danger { background: #e05a5a; }
  .hist-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(74,108,247,.08); font-size: .88rem; }
  .hist-table th { background: #4a6cf7; color: #fff; padding: 9px 6px; }
  .hist-table td { padding: 7px 6px; border-bottom: 1px solid #eef2ff; text-align: center; }
  .hist-table tr:nth-child(even) td { background: #f8faff; }
  @media (max-width: 480px) { .word { font-size: 1.6rem; } .emoji { font-size: 2.6rem; } .ch, .ch input { width: 28px; height: 38px; font-size: 1.15rem; } }
</style>
</head>
<body>
<header>
  <h1>📚 台灣高中英文參考詞彙表</h1>
  <p>學測 4000 字＋指考 7000 字（共 5782 字）｜ 點卡片翻面 ｜ 🔊 聽發音</p>
</header>
<div class="tabs">
  <button id="tabCard" class="active" onclick="switchMode('card')">🃏 單字卡</button>
  <button id="tabList" onclick="switchMode('list')">📋 單字列表</button>
  <button id="tabQuiz" onclick="switchMode('quiz')">✏️ 填空測驗</button>
  <button id="tabHistory" onclick="switchMode('history')">📊 學習歷程</button>
</div>

<!-- 下載提示列 -->
<div id="dlBar"></div>

<!-- 左右翻卡箭頭 -->
<button class="arrow left" id="arrowL" title="上一張" onclick="arrowNav(-1)">⬅</button>
<button class="arrow right" id="arrowR" title="下一張" onclick="arrowNav(1)">➡</button>

<!-- 單字卡模式 -->
<div class="panel" id="cardPanel">
  <div class="nav" style="margin-bottom:4px">
    <button class="ghost" onclick="shuffleCards()">🔀 洗牌</button>
    <button class="ghost" id="autoBtn" onclick="toggleAuto()">🔁 自動播放</button>
    <label style="font-size:.9rem;color:#666">⏱️</label>
    <select id="autoSec" style="padding:8px 10px;border-radius:12px;border:1px solid #ccd6ff;font-size:.95rem;background:#fff;cursor:pointer">
      <option value="1">間隔 1 秒</option><option value="2">間隔 2 秒</option><option value="3" selected>間隔 3 秒</option><option value="4">間隔 4 秒</option><option value="5">間隔 5 秒</option><option value="6">間隔 6 秒</option><option value="7">間隔 7 秒</option><option value="8">間隔 8 秒</option><option value="9">間隔 9 秒</option><option value="10">間隔 10 秒</option>
    </select>
    <label style="font-size:.9rem;color:#666">🗣️</label>
    <select id="rateSel" style="padding:8px 10px;border-radius:12px;border:1px solid #ccd6ff;font-size:.95rem;background:#fff;cursor:pointer">
      <option value="0.5">語速 0.5×</option><option value="0.6">0.6×</option><option value="0.7">0.7×</option><option value="0.8">0.8×</option><option value="0.85" selected>語速 0.85×（預設）</option><option value="0.9">0.9×</option><option value="1.0">1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.4">1.4×</option><option value="1.6">1.6×</option>
    </select>
    <span class="counter" id="cardCounter"></span>
  </div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front">
        <div class="emoji" id="cardEmoji"></div>
        <div class="word" id="cardWord"></div>
        <div class="pos" id="cardPos"></div>
        <div class="speak-row">
          <button class="speak-btn" title="英文發音" onclick="event.stopPropagation();speakEn()">🔊 EN</button>
          <button class="speak-btn" title="中文發音" onclick="event.stopPropagation();speakZh()">🔊 中</button>
        </div>
        <div class="hint">點卡片看中文意思</div>
      </div>
      <div class="face back">
        <div class="emoji" id="cardEmojiBack"></div>
        <div class="zh" id="cardZh"></div>
        <button class="speak-btn light" onclick="event.stopPropagation();speakZh()">🔊 中文發音</button>
        <div class="hint" style="color:rgba(255,255,255,.7)">再點一次回英文</div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button class="ghost" onclick="prevCard()">⬅ 上一個</button>
    <button onclick="speakEn()">🔊 發音</button>
    <button class="ghost" onclick="nextCard()">下一個 ➡</button>
  </div>
  <div class="filter-row" id="letterFilter"></div>
  <div class="filter-row" id="levelFilter"></div>
</div>

<!-- 單字列表模式 -->
<div class="panel" id="listPanel" style="display:none">
  <div class="list-tools">
    <input id="searchBox" placeholder="🔍 搜尋英文或中文…" oninput="renderList()">
  </div>
  <div class="filter-row" id="listLetterFilter"></div>
  <div class="filter-row" id="listLevelFilter"></div>
  <div class="grid" id="wordGrid"></div>
</div>



<!-- 學習歷程模式 -->
<div class="panel" id="historyPanel" style="display:none">
  <div class="hist-summary" id="histSummary"></div>
  <div class="hist-actions">
    <button onclick="downloadCSV()">⬇️ 下載 CSV</button>
    <button onclick="downloadTXT()">⬇️ 下載 TXT</button>
    <button class="danger" onclick="clearHistory()">🗑️ 清除紀錄</button>
  </div>
  <div style="overflow-x:auto">
    <table class="hist-table">
      <thead><tr><th>時間</th><th>類型</th><th>英文</th><th>中文</th><th>結果</th></tr></thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
</div>

<!-- 測驗模式 -->
<div class="panel" id="quizPanel" style="display:none">
  <!-- 測驗設定 -->
  <div class="quiz-box" id="quizSetup">
    <div style="font-size:1.2rem;font-weight:bold;margin-bottom:14px">⚙️ 測驗設定</div>
    <div class="setup-label">測驗題數</div>
    <div class="setup-row" id="countRow">
      <button data-c="10" class="active">10 題</button>
      <button data-c="20">20 題</button>
      <button data-c="30">30 題</button>
      <button data-c="all">全部</button>
    </div>
    <div class="setup-label">字母種類</div>
    <div class="setup-row" id="quizLetterRow"></div>
    <div class="setup-label">級別</div>
    <div class="setup-row" id="quizLevelRow"></div>
    <div style="margin-top:18px">
      <button style="padding:12px 40px;font-size:1.1rem" onclick="startQuiz()">🚀 開始測驗</button>
    </div>
    <div class="score" id="setupInfo" style="margin-top:12px"></div>
  </div>

  <!-- 測驗進行中 -->
  <div class="quiz-box" id="quizMain" style="display:none">
    <div class="quiz-zh" id="quizZh"></div>
    <div class="quiz-pos" id="quizPos"></div>
    <div class="blanks" id="quizBlanks"></div>
    <div class="quiz-actions">
      <button onclick="checkQuiz()">✅ 檢查答案</button>
      <button class="warn" onclick="revealQuiz()">👀 顯示答案</button>
      <button class="ghost" onclick="quizHint()">🔊 發音提示</button>
      <button class="ghost" onclick="nextQuiz()">下一題 ➡</button>
    </div>
    <div class="feedback" id="quizFeedback"></div>
    <div class="score" id="quizScore"></div>
    <div style="margin-top:10px"><button class="ghost" onclick="backToSetup()" style="padding:8px 16px;font-size:.9rem;border:none;border-radius:10px;background:#dfe6ff;color:#4a6cf7;cursor:pointer">⚙️ 重新設定</button></div>
  </div>

  <!-- 測驗結果 -->
  <div class="quiz-box" id="quizResult" style="display:none">
    <div style="font-size:3rem">🏁</div>
    <div style="font-size:1.4rem;font-weight:bold;margin:10px 0" id="resultText"></div>
    <div class="quiz-actions">
      <button onclick="startQuiz()">🔁 再測一次</button>
      <button class="ghost" onclick="backToSetup()">⚙️ 重新設定</button>
    </div>
  </div>
</div>

let audioCtx = null;
function tone(freq, t0, dur, vol=0.22, type='sine'){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001, audioCtx.currentTime+t0);
  g.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(audioCtx.currentTime+t0); o.stop(audioCtx.currentTime+t0+dur+0.05);
}

// 日文偏好溫暖女聲（依瀏覽器可用語音自動挑選）
const FEMALE_JA_HINTS = ['female','woman','google 日本語','kyoko','kyōko','otoya','kyouko','haruka','ayumi','mizuki','sakura','nanami','mei-jia','yui','nozomi','himari','aoi','siri female','りんご'];
function pickVoice(lang){
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(lang.split('-')[0]));
  if(!vs.length) return null;
  if(lang.startsWith('ja')){
    const fem = vs.find(v => FEMALE_JA_HINTS.some(h => v.name.toLowerCase().includes(h)));
    if(fem) return fem;
  }
  return vs[0];
}
function speak(text, lang){
  if(!('speechSynthesis' in window)){ alert('此瀏覽器不支援語音功能'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('zh') ? 0.85 : getRate();
  if(lang.startsWith('ja')) u.pitch = 1.1; // 稍微提高音調，聽起來更溫暖
  const v = pickVoice(lang);
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices(); }


// ===== 自動播放（念英文→中文，自動翻下一張） =====
let autoMode = false, autoTimer = null, utterCount = 0;
function speakCb(text, lang, cb){
  if(!('speechSynthesis' in window)){ cb&&cb(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = lang.startsWith('zh') ? 0.85 : getRate();
  if(lang.startsWith('ja')) u.pitch = 1.1;
  const v = pickVoice(lang);
  if(v) u.voice = v;
  let done=false;
  const fin=()=>{ if(!done){done=true; cb&&cb();} };
  u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
  setTimeout(fin, Math.max(2500, text.length*250)); // 保險逾時
}

function speak2(text, lang, cb){
  // 自動播放：外文（英文/日文）連唸兩遍
  speakCb(text, lang, ()=>{ setTimeout(()=>speakCb(text, lang, cb), 350); });
}

function buildQuiz(){
  const idx = quizOrder[qi], [w,pos,zh] = WORDS[idx];
  document.getElementById('quizZh').textContent = zh;
  document.getElementById('quizPos').textContent = pos + '　（共 ' + w.replace(/[^a-zA-Z]/g,'').length + ' 個字母）';
  const fb0=document.getElementById('quizFeedback'); fb0.textContent=''; fb0.className='feedback';
  const box = document.getElementById('quizBlanks'); box.innerHTML='';
  const chars = [...w];
  const alpha = chars.map(c=>/[a-zA-Z]/.test(c));
  const blank = chars.map((c,i)=>{
    if(!alpha[i]) return false;
    const prevAlpha = i>0 && alpha[i-1];
    if(!prevAlpha) return false;
    return Math.random() < 0.65;
  });
  if(!blank.some(b=>b)){ const cand = chars.map((c,i)=>alpha[i]&&(i>0&&alpha[i-1])?i:-1).filter(i=>i>=0); if(cand.length) blank[cand[0]]=true; }
  chars.forEach((c,i)=>{
    const span=document.createElement('span');
    if(alpha[i]){
      if(blank[i]){
        span.className='ch';
        const inp=document.createElement('input');
        inp.maxLength=1; inp.dataset.ans=c.toLowerCase(); inp.autocomplete='off';
        inp.oninput=()=>{ const nx=nextInput(inp); if(inp.value&&nx) nx.focus(); };
        inp.onkeydown=e=>{ if(e.key==='Backspace'&&!inp.value){const pv=prevInput(inp); if(pv){pv.focus(); pv.value='';}} };
        span.appendChild(inp);
      } else { span.className='ch shown'; span.textContent=c; }
    } else if(c===' '){ span.className='ch space'; }
    else { span.className='ch punct'; span.textContent=c; }
    box.appendChild(span);
  });
  const first=box.querySelector('input'); if(first) first.focus();
  updateScore();
}
function nextInput(el){ const ins=[...document.querySelectorAll('#quizBlanks input')]; const i=ins.indexOf(el); return ins[i+1]||null; }
function prevInput(el){ const ins=[...document.querySelectorAll('#quizBlanks input')]; const i=ins.indexOf(el); return ins[i-1]||null; }
function updateScore(){ document.getElementById('quizScore').textContent = '得分：'+qScore+' / '+qTotal+'　｜　第 '+(qi+1)+' 題 / 共 '+quizOrder.length+' 題'; }
function checkQuiz(){

function downloadFile(content, filename, mime){
  let url, revoke=false;
  try{
    const blob=new Blob([content],{type:mime});
    url=URL.createObjectURL(blob); revoke=true;
  }catch(e){
    url='data:'+mime+','+encodeURIComponent(content);
  }
  // 1) 嘗試自動觸發下載
  try{
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); },3000);
  }catch(e){}
  // 2) 顯示下載提示列（Android Chrome 可點擊或長按另存）
  const bar=document.getElementById('dlBar');
  bar.innerHTML='';
  const link=document.createElement('a');
  link.href=url; link.download=filename;
  link.textContent='📥 '+filename;
  const close=document.createElement('button');
  close.textContent='✕';
  close.onclick=()=>{ bar.style.display='none'; if(revoke) URL.revokeObjectURL(url); };
  const tip=document.createElement('div'); tip.className='tip';
  tip.textContent='若未自動下載：點上方連結，或「長按連結 → 下載連結」即可儲存';
  bar.appendChild(link); bar.appendChild(close); bar.appendChild(tip);
  bar.style.display='flex';
  setTimeout(()=>{ if(bar.style.display==='flex' && revoke) URL.revokeObjectURL(url); },60000);
}

function switchMode(m){
  ['card','list','quiz','history'].forEach(k=>{
    document.getElementById('tab'+k[0].toUpperCase()+k.slice(1)).classList.toggle('active',m===k);
    document.getElementById(k+'Panel').style.display = m===k?'block':'none';
  });
  const showArrow = m==='card'?'block':'none';
  document.getElementById('arrowL').style.display = showArrow;
  document.getElementById('arrowR').style.display = showArrow;
  if(m!=='card' && autoMode){ toggleAuto(); }
  if(m==='list') renderList();
  if(m==='history') renderHistory();
}
renderCard();
updateSetupInfo();
document.getElementById('arrowL').style.display='block';
document.getElementById('arrowR').style.display='block';
</script>
</body>
</html>
